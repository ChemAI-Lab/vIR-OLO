[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virolo"
version = "1.0.0"
description = "A PyQt5-based spectral image annotation tool"
readme = "README.md"
# `str | Path` annotations in tools/donwload_default_models.py need 3.10+
requires-python = ">=3.10"
# TODO before the first PyPI upload: fill in `authors` and `license`.
dependencies = [
    "PyQt5",
    "Pillow",
    "opencv-python",
    "numpy",
    "PyYAML",
    "huggingface_hub",
    "requests",
    "ultralytics",
]

[project.urls]
Homepage = "https://github.com/UGarCil/vIR-OLO"
Issues = "https://github.com/UGarCil/vIR-OLO/issues"

[project.scripts]
virolo = "virolo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["virolo*"]

[tool.setuptools.package-data]
virolo = ["dataset.yaml", "ui/icons/*.png", "ui/*.ui"]
